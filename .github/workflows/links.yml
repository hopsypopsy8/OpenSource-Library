name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 20 * * 0" # weekly, Monday 06:00 AEST

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept 200,206,429 README.md CONTRIBUTING.md
          fail: ${{ github.event_name != 'schedule' }}
      - name: Open issue on broken links (scheduled runs)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken-link
